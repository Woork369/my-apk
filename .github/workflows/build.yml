name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Android workload
      run: dotnet workload install android

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      # Убран флаг -f, так как платформа будет взята из NetPulseAndroid.csproj
      run: dotnet build -c Release

    - name: Publish APK (Debug Key)
      # Убран флаг -f по той же причине
      run: dotnet publish -c Release -p:AndroidKeyStore=false

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NetPulseAndroid-APK
        path: bin/Release/net10.0-android/publish/*.apk
